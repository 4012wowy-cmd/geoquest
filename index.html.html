const $=id=>document.getElementById(id);const ns='http://www.w3.org/2000/svg';let pool=[],current=null,index=0,score=0,streak=0,correct=0,answered=false,total=10;
for(const s of shapes){let p=document.createElementNS(ns,'path');p.setAttribute('d',s.path);p.setAttribute('class','land');p.dataset.id=s.id;$('land').appendChild(p)}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function start(){let region=$('region').value;total=+$('length').value;let candidates=countries.filter(x=>region==='All'||x.region===region);pool=shuffle(candidates).slice(0,Math.min(total,candidates.length));index=score=streak=correct=0;$('next').style.display='none';show()}
function zoom(c){let [x1,y1,x2,y2]=c.bounds;let cx=(x1+x2)/2,cy=(y1+y2)/2;let w=Math.max(17,(x2-x1)*2.35),h=Math.max(12,(y2-y1)*2.35);let ratio=900/450;if(w/h<ratio)w=h*ratio;else h=w/ratio;w=Math.min(360,w);h=Math.min(180,h);let vx=Math.max(0,Math.min(900-w,(cx+180)*2.5-w/2));let vy=Math.max(0,Math.min(450-h,(90-cy)*2.5-h/2));$('map').setAttribute('viewBox',`${vx} ${vy} ${w*2.5} ${h*2.5}`)}
function show(){answered=false;$('result').textContent='';$('next').style.display='none';$('choices').innerHTML='';if(index>=pool.length){$('question').textContent='🎉 게임 완료!';$('hint').textContent=`${pool.length}문제 중 ${correct}문제 정답 · 총 ${score}점`; $('counter').textContent='완료';$('map').setAttribute('viewBox','0 0 900 450');document.querySelectorAll('.land').forEach(p=>p.classList.remove('target'));$('next').textContent='다시 플레이 ↻';$('next').style.display='block';return}
current=pool[index];$('counter').textContent=`문제 ${index+1} / ${pool.length}`;let capital=$('mode').value==='capital';$('question').textContent=capital?'초록색 국가의 수도는 어디일까?':'초록색으로 표시된 나라는 어디일까?';$('hint').textContent=capital?'국가 이름은 정답을 고르면 공개돼.':'지도에서 강조된 국가의 이름을 골라봐.';$('maplabel').textContent='🟢 초록색 국가를 확인해!';document.querySelectorAll('.land').forEach(p=>p.classList.toggle('target',p.dataset.id===current.id));zoom(current);
let options=shuffle([current,...shuffle(countries.filter(x=>x.id!==current.id && x.region===current.region)).slice(0,3)]);if(options.length<4)options=shuffle([current,...shuffle(countries.filter(x=>x.id!==current.id)).slice(0,3)]);options=shuffle(options);for(let x of options){let b=document.createElement('button');b.className='choice';b.textContent=capital?x.capital:x.ko;b.onclick=()=>choose(x,b);$('choices').appendChild(b)}}
function choose(x,b){if(answered)return;answered=true;let ok=x.id===current.id;if(ok){score+=10;streak++;correct++}else streak=0;let cap=$('mode').value==='capital';document.querySelectorAll('.choice').forEach(el=>{el.disabled=true;if(el.textContent===(cap?current.capital:current.ko))el.classList.add('correct')});if(!ok)b.classList.add('wrong');$('result').textContent=ok?`✅ 정답! ${current.ko} · ${current.capital}`:`❌ 아쉬워! 정답은 ${cap?current.capital:current.ko} (${current.ko})`;$('score').textContent=score;$('accuracy').textContent=Math.round(correct/(index+1)*100)+'%';$('streak').textContent=streak;$('next').textContent=index===pool.length-1?'결과 보기 →':'다음 문제 →';$('next').style.display='block'}
$('next').onclick=()=>{if(index>=pool.length)start();else{index++;show()}};$('restart').onclick=start;$('mode').onchange=start;$('region').onchange=start;$('length').onchange=start;start();
